<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Love Puzzle</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8e1e1; text-align: center; }
        #puzzle { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .piece { width: 100px; height: 100px; background-color: #ff6b81; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Valentine's Day Love Puzzle</h1>
    <div id="puzzle"></div>
    <button id="shuffle">Shuffle</button>
    <script>
        const words = ['Love', 'Heart', 'Cupid', 'Romance', 'Together', 'Hugs', 'Kisses'];
        let shuffledWords = [];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createPuzzle() {
            const puzzle = document.getElementById('puzzle');
            puzzle.innerHTML = '';
            shuffledWords.forEach(word => {
                const piece = document.createElement('div');
                piece.classList.add('piece');
                piece.textContent = word;
                piece.onclick = () => alert(`You clicked on: ${word}`);
                puzzle.appendChild(piece);
            });
        }

        document.getElementById('shuffle').onclick = () => {
            shuffledWords = shuffle([...words]);
            createPuzzle();
        };

        // Initial shuffle and create
        shuffledWords = shuffle([...words]);
        createPuzzle();
    </script>
</body>
</html>
